# k8s/envoy-local.yaml
static_resources:
  listeners:
  - name: listener_0
    address:
      socket_address: { address: 0.0.0.0, port_value: 8080 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          route_config:
            name: local_route
            virtual_hosts:
            - name: local_service
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: fastapi_service }
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
          http_filters:
          - name: envoy.filters.http.ext_proc
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
              grpc_service:
                envoy_grpc:
                  cluster_name: onnx_ext_proc_cluster
              processing_mode:
                request_header_mode: SEND
                response_header_mode: SKIP
                request_body_mode: BUFFERED
                response_body_mode: NONE
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  
  clusters:
  - name: fastapi_service
    connect_timeout: 0.25s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: fastapi_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              # Perhatikan: di Docker Compose network_mode, kita memanggil IP localhost
              socket_address: { address: 127.0.0.1, port_value: 8000 }
              
  - name: onnx_ext_proc_cluster
    connect_timeout: 0.25s
    type: STRICT_DNS
    http2_protocol_options: {}
    load_assignment:
      cluster_name: onnx_ext_proc_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            # Sama seperti di atas, gunakan localhost
            address:
              socket_address: { address: 127.0.0.1, port_value: 50051 }
