# k8s/01-configmap-envoy.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
  labels:
    app: secure-api
data:
  envoy.yaml: |
    static_resources:
      listeners:
      - name: listener_0
        address:
          socket_address: { address: 0.0.0.0, port_value: 8080 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress_http
              route_config:
                name: local_route
                virtual_hosts:
                - name: local_service
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/" }
                    route: { cluster: fastapi_service }
              http_filters:
              # ----------------------------------------------------
              # Konfigurasi Ext-Proc untuk Machine Learning Filter
              # ----------------------------------------------------
              - name: envoy.filters.http.ext_proc
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                  grpc_service:
                    envoy_grpc:
                      cluster_name: onnx_ext_proc_cluster
                  processing_mode:
                    # Menentukan bagian mana dari request yang dikirim ke ML Service
                    request_header_mode: SEND
                    response_header_mode: SKIP
                    request_body_mode: BUFFERED # Penting jika model ML butuh membaca payload body
                    response_body_mode: NONE
              - name: envoy.filters.http.router
      
      clusters:
      # ----------------------------------------------------
      # Cluster 1: Aplikasi FastAPI Utama (Port 8000)
      # ----------------------------------------------------
      - name: fastapi_service
        connect_timeout: 0.25s
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: fastapi_service
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: { address: 127.0.0.1, port_value: 8000 }
                  
      # ----------------------------------------------------
      # Cluster 2: ML ONNX gRPC Service (Port 50051)
      # ----------------------------------------------------
      - name: onnx_ext_proc_cluster
        connect_timeout: 0.25s
        type: STRICT_DNS
        http2_protocol_options: {} # Ext-Proc (gRPC) Wajib menggunakan HTTP/2
        load_assignment:
          cluster_name: onnx_ext_proc_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: { address: 127.0.0.1, port_value: 50051 }
